# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
#
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml

stages:
  - test
  - build

variables:
  PNPM_STORE_PATH: "$CI_PROJECT_DIR/.pnpm-store"

.node_setup:
  image: node:22-bookworm-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.32.1 --activate
    - pnpm config set store-dir "$PNPM_STORE_PATH"
    - pnpm install --frozen-lockfile
    # @prisma/client não está em pnpm.onlyBuiltDependencies (package.json raiz),
    # então seu postinstall (que geraria o client) fica bloqueado pelo pnpm —
    # sem isso, lint/typecheck/test/build falham em runner limpo com
    # "Cannot find module '.prisma/client/default'". Mesmo passo do
    # apps/api/Dockerfile.
    - pnpm --filter @aurafarming/api exec prisma generate --schema=prisma/schema.prisma
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
      - .turbo
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

lint:
  extends: .node_setup
  stage: test
  script:
    - pnpm turbo run lint --cache-dir=.turbo

typecheck:
  extends: .node_setup
  stage: test
  script:
    - pnpm turbo run typecheck --cache-dir=.turbo

test:
  extends: .node_setup
  stage: test
  script:
    - pnpm turbo run test --cache-dir=.turbo

build:
  extends: .node_setup
  stage: build
  script:
    - pnpm turbo run build --cache-dir=.turbo

ai-service:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  before_script:
    - cd services/ai
    - uv sync --frozen
  script:
    - uv run ruff check .
    - uv run pytest
  cache:
    key:
      files:
        - services/ai/uv.lock
    paths:
      - .uv-cache
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -f apps/api/Dockerfile -t aurafarming-api:ci .
    - docker build -f services/ai/Dockerfile -t aurafarming-ai:ci services/ai
    # Publica no Container Registry do próprio projeto (CI_REGISTRY_* são
    # variáveis nativas do GitLab CI, sem segredo novo — Prompt 24) — pré-
    # requisito do template de Container Scanning, que exige uma imagem
    # endereçável (CS_IMAGE) já publicada em algum registry.
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker tag aurafarming-api:ci "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"
    - docker tag aurafarming-ai:ci "$CI_REGISTRY_IMAGE/ai:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/ai:$CI_COMMIT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag aurafarming-api:ci "$CI_REGISTRY_IMAGE/api:latest"
        docker tag aurafarming-ai:ci "$CI_REGISTRY_IMAGE/ai:latest"
        docker push "$CI_REGISTRY_IMAGE/api:latest"
        docker push "$CI_REGISTRY_IMAGE/ai:latest"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

container_scanning_api:
  extends: container_scanning
  stage: build
  needs: ["docker-build"]
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"
    CS_REGISTRY_USER: "$CI_REGISTRY_USER"
    CS_REGISTRY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

container_scanning_ai:
  extends: container_scanning
  stage: build
  needs: ["docker-build"]
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/ai:$CI_COMMIT_SHA"
    CS_REGISTRY_USER: "$CI_REGISTRY_USER"
    CS_REGISTRY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
