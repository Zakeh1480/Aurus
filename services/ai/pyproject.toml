[project]
name = "aurafarming-ai"
version = "0.0.0"
requires-python = ">=3.12"
description = "Serviço de scoring do Aura Score (FastAPI) — transforma AuraFeatures em AuraScore"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.16.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# F (pyflakes: bugs reais) + I (ordenação de imports). E501 fica de fora —
# o código existente não segue 100 cols e reformatar tudo foge do escopo
# deste prompt (DevOps), não é um bug.
select = ["F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
